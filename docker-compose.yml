# Run Odoo 17 with this module mounted:  docker compose up
# then open http://localhost:8069, create a database and install "Equipment Rental".
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:17.0
    depends_on: [db]
    ports: ["8069:8069"]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./:/mnt/extra-addons
      - odoo-data:/var/lib/odoo

volumes:
  db-data:
  odoo-data:
