name: Odoo tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: addons
      - uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: "17.0"
          path: odoo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Odoo dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev
          pip install -r odoo/requirements.txt
      - name: Install module and run tests
        run: |
          python odoo/odoo-bin --addons-path=odoo/addons,odoo/odoo/addons,addons \
            --db_host=localhost --db_user=odoo --db_password=odoo -d ci \
            -i equipment_rental --test-enable --test-tags=/equipment_rental \
            --stop-after-init --log-level=test
